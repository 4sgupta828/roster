[project]
name = "roster"
version = "0.0.0"
description = "Roster — vertical-agnostic deep-tech research platform (kernel + vertical plug-ins)"
requires-python = ">=3.13"
readme = "README.md"

# Monorepo: the installable packages live under packages/*. Each has its own
# pyproject. This root is the workspace anchor + shared tooling config.

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "evals"]
markers = [
    "slow: slower tests (docling/parsing/soak)",
    "integration: requires a live DB",
    "conformance: VerticalConformance contract suite",
]

[tool.mypy]
python_version = "3.13"
strict = true
