[project]
name = "roster-kernel"
version = "0.0.0"
description = "Roster domain-agnostic evidence/research kernel"
requires-python = ">=3.13"
# Deps added per phase (P1 ingestion, P2 retrieval, ...). Kept minimal on purpose.
dependencies = []

[project.optional-dependencies]
# The Postgres retrieval backend (pgvector + tsvector). Optional so the offline
# kernel + tests need no DB driver; installed to run PostgresRetrievalSource.
postgres = ["asyncpg>=0.30", "pgvector>=0.3"]
s3 = ["boto3>=1.34"]
# Real providers + API. All lazy-imported; only needed in record/live mode or to
# serve the app. Tests run offline on cassettes/fakes without these.
serve = ["anthropic>=0.40", "openai>=1.40", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.30"]

[project.entry-points."roster.verticals"]
# Verticals register here (in THEIR pyproject), e.g.:
#   tech = "roster_vertical:manifest"
# The kernel discovers all installed verticals via this entry-point group.
# A deployment activates exactly ONE (single-vertical-per-deployment, O3).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roster_kernel"]
