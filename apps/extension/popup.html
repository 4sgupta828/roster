<!doctype html>
<html><head><meta charset="utf-8"><title>Roster Apply</title>
<style>
  body{font:13px system-ui;margin:0;padding:12px;width:340px;color:#1b1f2a;background:#fff}
  h1{font-size:14px;margin:0 0 8px} input{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #cfd3dc;border-radius:6px;font:inherit}
  button{font:inherit;padding:6px 10px;border-radius:999px;border:1px solid #6c5ce7;background:#fff;color:#6c5ce7;cursor:pointer;font-weight:600}
  button.primary{background:#6c5ce7;color:#fff} .row{display:flex;gap:6px;align-items:center;margin:6px 0}
  .app{border:1px solid #e6e8ef;border-radius:8px;padding:8px;margin:6px 0} .muted{color:#6b7280;font-size:12px} .st{font-size:11px;padding:1px 6px;border-radius:999px;background:#eef}
  #note{margin-top:8px;font-size:12px;color:#374151;white-space:pre-wrap}
</style></head>
<body>
  <h1>Roster Apply</h1>
  <div id="connect">
    <div class="muted">Paste your Roster token once (Account → Apply profile → “Connect the extension”).</div>
    <div class="row"><input id="token" type="password" placeholder="Roster token"><button id="save">Connect</button></div>
  </div>
  <div id="apps"></div>
  <div class="muted" style="margin-top:8px">The extension fills the form on the page you have open. It never submits — you review and click submit.</div>
  <div id="note"></div>
  <script src="popup.js"></script>
</body></html>
